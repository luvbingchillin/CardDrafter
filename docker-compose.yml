version: '3.8'

services:
  # 1. Redis Service
  redis:
    image: redis:7-alpine
    container_name: cardsim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # 2. Go Backend Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_ADDR=redis:6379
      - ANALYTICS_ADDR=analytics:50051
    depends_on:
      - redis
      - analytics
    restart: unless-stopped

  # 3. Python Analytics & Data Science Service
  analytics:
    build:
      context: ./Analytics
      dockerfile: Dockerfile
    container_name: cardsim-analytics
    ports:
      - "8001:8001"   # FastAPI HTTP docs & health check
      - "50051:50051" # gRPC binary port
    restart: unless-stopped

  # 4. Frontend + Nginx Service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data: